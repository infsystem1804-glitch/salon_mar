<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Personal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card p-4 shadow-sm" style="width: 320px;">
        <h5 class="text-center mb-3">🔐 Acceso Personal</h5>
        {% if error %}<div class="alert alert-danger py-1 small">{{ error }}</div>{% endif %}
        <form method="POST">
            <input type="password" name="pin" class="form-control text-center mb-3" placeholder="Ingresa PIN (1234)" required>
            <button type="submit" class="btn btn-dark w-100">Entrar</button>
            <a href="/" class="btn btn-link w-100 mt-2 text-decoration-none">Volver a la agenda</a>
        </form>
    </div>
</body>
</html>
